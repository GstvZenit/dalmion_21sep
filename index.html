<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>NGC 4038 / 4039 — access</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="scanlines" aria-hidden="true"></div>
  <main class="login-window">
    <div class="titlebar"><span>●</span><span>●</span><span>●</span><b>wired_access.exe</b></div>
    <section class="login-content">
      <p class="system">NGC 4038 / NGC 4039 // transmisión privada</p>
      <h1 data-shadow="ENTER THE WIRED">ENTER THE WIRED</h1>
      <p>please enter the password to continue.</p>
      <form id="login-form">
        <label for="password">PASSWORD:</label>
        <input id="password" type="password" autocomplete="current-password" autofocus required>
        <button type="submit">CONNECT →</button>
      </form>
      <p id="message" class="message" aria-live="polite"></p>
    </section>
  </main>
  <p class="image-credit">Antennae Galaxies background: ESA/Hubble</p>
  <script src="site.js"></script>
</body>
</html>
